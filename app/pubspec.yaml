name: openfamily
description: A self-hosted, privacy-first family location tracker.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Secure token storage backed by iOS Keychain / Android Keystore.
  flutter_secure_storage: ^9.2.2
  # Face ID / Touch ID / Android biometric authentication for app unlock.
  # 2.3.x supports the project's Dart 3.4 lower bound.
  local_auth: ^2.3.0
  # HTTP client for the API (used by the login stub later).
  http: ^1.2.2
  # Background location tracking: runs a background isolate so the device keeps
  # reporting its position when the app is backgrounded or killed.
  background_locator_2: ^2.0.6
  # Plain key-value storage readable from the background isolate (credentials).
  shared_preferences: ^2.3.0
  # Interactive map (OpenStreetMap tiles) for the map-first home screen.
  flutter_map: ^7.0.2
  # Vector (OpenMapTiles) rendering for crisp maps; 8.0.x targets flutter_map 7.
  vector_map_tiles: ^8.0.0
  # Geographic coordinate type used by flutter_map.
  latlong2: ^0.9.1
  # Pure-Dart QR code rendering for invite links.
  qr_flutter: ^4.1.0
  package_info_plus: ^8.0.0
  # Native share sheet for the "Send Code" invite flow.
  share_plus: ^10.0.0
  # Permissions (location / notifications / motion) for onboarding.
  permission_handler: ^11.3.1
  # Profile photo picker for the authenticated profile screen.
  image_picker: ^1.1.2
  # Native contact picker for emergency contacts. Uses the OS picker so the
  # app never needs READ_CONTACTS / full address-book access.
  flutter_native_contact_picker: ^0.0.12
  # Current device location (place picker + welcome hero), with graceful
  # fallback when permission is denied or services are off.
  geolocator: ^13.0.2
  # Reads the device battery level so location reports can carry battery_pct.
  battery_plus: ^6.0.0
  # Detects Google Play Services availability on Android so motion & fitness
  # is only requested on devices that actually support activity recognition.
  google_api_availability: ^5.0.1
  # Opens Android system settings deep links (battery-optimization exemption)
  # so background location keeps running when the app is closed. Android only;
  # iOS needs no equivalent.
  android_intent_plus: ^5.1.0
  # WebSocket client for the live location stream (/ws/stream). Web-safe
  # (no dart:io) and carries the access token as the subprotocol.
  web_socket_channel: ^3.0.0
  # OS connectivity events, so offline→online transitions recover
  # event-driven: the service reconnects the WebSocket immediately and a
  # failed initial map load retries itself instead of waiting on backoff
  # timers or a manual Retry tap.
  connectivity_plus: ^6.1.0
  flutter_local_notifications: ^22.3.0
  unifiedpush: ^6.2.0
  # Accelerometer + gyroscope for on-device hard-brake / rapid-acceleration
  # detection (SensorManager on Android; no Google Play Services). Sampled only
  # while the GPS says the user is driving; raw samples never leave the phone.
  sensors_plus: ^7.1.1
  # Android screen on/off/unlock broadcasts (optional "screen activity while
  # moving" estimate). Local plugin, no permissions.
  driving_native:
    path: packages/driving_native

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# background_locator_2 is abandoned upstream (last published 3 years ago) and
# its Android build.gradle still references jcenter(), which was removed in
# Gradle 8+. We vendor a patched copy (jcenter removed, modern AGP/Kotlin, and a
# Kotlin null-safety fix in LocationParserUtil.kt) so the APK builds in CI.
dependency_overrides:
  background_locator_2:
    path: packages/background_locator_2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
