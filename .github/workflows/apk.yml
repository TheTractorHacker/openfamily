name: Android release

# Pushing a tag v* (e.g. v0.2.0, v0.2.0-rc.1) builds a SIGNED release APK and
# AAB and publishes a GitHub Release. Obtainium and the server's APK cache
# (backend/internal/apkrelease) follow the latest v* release. Manual runs
# (workflow_dispatch) build and keep the files as workflow artifacts only; they
# never create a release.
#
# Secrets (see docs/android-release.md and scripts/android-secrets.sh):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# versionName = tag without the leading "v" (manual run: pubspec version).
# versionCode = (major*1000000 + minor*1000 + patch)*100 + suffix, where suffix
# is 99 for a final release and the rc/beta number (1..98) for a pre-release,
# so every newer tag installs over older builds. Patch/minor must stay < 1000.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # only used to create the Release on tag pushes
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          set -euo pipefail
          if [ "$IS_TAG" = "true" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml | head -1)"
          fi
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z]+\.?[0-9]+)?$'; then
            echo "Version '$V' is not semver like 1.2.3 or 1.2.3-rc.1" >&2; exit 1
          fi
          BASE="${V%%-*}"
          IFS=. read -r MA MI PA <<<"$BASE"
          if [ "$MI" -ge 1000 ] || [ "$PA" -ge 1000 ] || [ "$MA" -ge 20 ]; then
            echo "version component out of range" >&2; exit 1
          fi
          SUFFIX=99; PRE=false
          if [ "$V" != "$BASE" ]; then
            PRE=true
            N="$(echo "${V#*-}" | grep -Eo '[0-9]+$')"
            SUFFIX=$(( N > 98 ? 98 : N ))
            [ "$SUFFIX" -ge 1 ] || SUFFIX=1
          fi
          CODE=$(( (MA*1000000 + MI*1000 + PA) * 100 + SUFFIX ))
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "versionName=$V versionCode=$CODE prerelease=$PRE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Missing secret $v" >&2; exit 1; fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/release.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "../release.jks"
          } > app/android/key.properties

      - name: Build release APK and AAB
        working-directory: app
        run: |
          flutter build apk --release \
            --build-name='${{ steps.ver.outputs.name }}' --build-number='${{ steps.ver.outputs.code }}'
          flutter build appbundle --release \
            --build-name='${{ steps.ver.outputs.name }}' --build-number='${{ steps.ver.outputs.code }}'

      - name: Stage and checksum
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.name }}'
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk "dist/openfamily-$V.apk"
          cp app/build/app/outputs/bundle/release/app-release.aab "dist/openfamily-$V.aab"
          (cd dist && sha256sum "openfamily-$V.apk" "openfamily-$V.aab" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "dist/openfamily-$V.apk" | grep -i 'SHA-256'

      - name: Remove signing material
        if: always()
        run: rm -f app/android/key.properties app/android/release.jks

      - name: Keep build files
        uses: actions/upload-artifact@v4
        with:
          name: openfamily-${{ steps.ver.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRE: ${{ steps.ver.outputs.prerelease }}
          V: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "$PRE" = "true" ]; then FLAGS+=(--prerelease); else FLAGS+=(--latest); fi
          gh release create "$GITHUB_REF_NAME" "${FLAGS[@]}" \
            --title "OpenFamily $V" \
            --notes "Android build $V (versionCode ${{ steps.ver.outputs.code }}). Verify the APK against SHA256SUMS.txt. Install/update with Obtainium; see docs/android-install-and-updates.md." \
            dist/*
