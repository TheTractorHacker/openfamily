name: Build Android APK and Play bundle

# Builds a signed release APK on merges that touch the Flutter app (and on
# manual dispatch) and publishes it as a GitHub Release tagged apk-<run_number>
# for testers. Those CI tags are never GitHub Latest (make_latest: false).
#
# Families and the admin Download button follow the latest user-facing v*
# semver GitHub Release (for example v0.1.0), not this apk-* firehose. The
# APK is not committed to the repository.
#
# Signing (required — debug-signed APKs cannot update each other across CI runs):
#   ANDROID_KEYSTORE_BASE64    base64-encoded upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD  keystore and key password
#   ANDROID_KEY_ALIAS          key alias (upload)
#
# versionCode is github.run_number so each published tester APK is newer than
# the last.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Only this job needs to write (publishes the GitHub Release).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ]; then
            echo "Missing Android signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS)" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "../upload-keystore.jks"
          } > app/android/key.properties

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build Google Play App Bundle
        working-directory: app
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Keep Google Play bundle for manual upload
        uses: actions/upload-artifact@v4
        with:
          name: openfamily-play-bundle-${{ github.run_number }}
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Stage APK
        run: |
          set -euo pipefail
          APK=$(find app/build/app/outputs -name 'app-release.apk' -print -quit)
          test -n "$APK" || { echo "APK not found after build" >&2; exit 1; }
          cp "$APK" openfamily-release.apk
          echo "Staged $APK -> openfamily-release.apk"
          ls -lh openfamily-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Android APK ${{ github.run_number }}
          files: openfamily-release.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: false
          body: |
            Tester APK built from ${{ github.sha }}.
            versionCode ${{ github.run_number }}.
            CI apk-* tags are not GitHub Latest. Families and the admin
            Download button follow the latest v* semver release.
