name: Android release

# Pushing a tag v* (e.g. v0.2.0, v0.2.0-rc.1) builds a SIGNED release APK and
# AAB and publishes a GitHub Release. Obtainium and the server's APK cache
# (backend/internal/apkrelease) follow the latest v* release. Manual runs
# (workflow_dispatch) build and keep the files as workflow artifacts only; they
# never create a release.
#
# Secrets (see docs/android-release.md and scripts/android-secrets.sh):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#
# versionName = tag without the leading "v" (manual run: pubspec version).
# versionCode = (major*1000000 + minor*1000 + patch)*100 + suffix, where suffix
# is 99 for a final release and the rc/beta number (1..98) for a pre-release,
# so every newer tag installs over older builds. Patch/minor must stay < 1000.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # only used to create the Release on tag pushes
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SBOM (SPDX) for this release (taken before any build output or signing material exists)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Derive version
        id: ver
        run: |
          set -euo pipefail
          if [ "$IS_TAG" = "true" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml | head -1)"
          fi
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z]+\.?[0-9]+)?$'; then
            echo "Version '$V' is not semver like 1.2.3 or 1.2.3-rc.1" >&2; exit 1
          fi
          BASE="${V%%-*}"
          IFS=. read -r MA MI PA <<<"$BASE"
          if [ "$MI" -ge 1000 ] || [ "$PA" -ge 1000 ] || [ "$MA" -ge 20 ]; then
            echo "version component out of range" >&2; exit 1
          fi
          SUFFIX=99; PRE=false
          if [ "$V" != "$BASE" ]; then
            PRE=true
            N="$(echo "${V#*-}" | grep -Eo '[0-9]+$')"
            SUFFIX=$(( N > 98 ? 98 : N ))
            [ "$SUFFIX" -ge 1 ] || SUFFIX=1
          fi
          CODE=$(( (MA*1000000 + MI*1000 + PA) * 100 + SUFFIX ))
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "versionName=$V versionCode=$CODE prerelease=$PRE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Analyze and test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Missing secret $v" >&2; exit 1; fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/android/release.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "../release.jks"
          } > app/android/key.properties

      - name: Build release APKs and AAB
        working-directory: app
        run: |
          # Three APKs, all with the SAME versionCode (no --split-per-abi, which
          # would add 1000*ABI to it and break updates between variants):
          #   orbitly-<v>.apk            arm64 + 32-bit arm. The default: it
          #                              installs on every phone (many 2 GB
          #                              phones run a 32-bit system) and is
          #                              what /app.apk serves.
          #   orbitly-<v>-arm64-v8a.apk  64-bit only, about 40 percent smaller.
          #   orbitly-<v>-armeabi-v7a.apk 32-bit only.
          # The x86_64 slice only serves emulators/ChromeOS; the AAB keeps every
          # ABI. The server's APK cache prefers the plain orbitly-<v>.apk, then
          # arm64-v8a (see backend/internal/apkrelease). Debug symbols are
          # stripped by Gradle; Dart symbols are not split (no --obfuscate, see
          # docs/developers/performance-low-memory.md).
          B=(--build-name='${{ steps.ver.outputs.name }}' --build-number='${{ steps.ver.outputs.code }}')
          mkdir -p ../apks
          flutter build apk --release --target-platform android-arm,android-arm64 "${B[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk ../apks/combined.apk
          flutter build apk --release --target-platform android-arm64 "${B[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk ../apks/arm64-v8a.apk
          flutter build apk --release --target-platform android-arm "${B[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk ../apks/armeabi-v7a.apk
          flutter build appbundle --release "${B[@]}"

      - name: Stage and checksum
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.name }}'
          mkdir -p dist
          cp sbom.spdx.json "dist/orbitly-$V.spdx.json"
          cp apks/combined.apk "dist/orbitly-$V.apk"
          cp apks/arm64-v8a.apk "dist/orbitly-$V-arm64-v8a.apk"
          cp apks/armeabi-v7a.apk "dist/orbitly-$V-armeabi-v7a.apk"
          cp app/build/app/outputs/bundle/release/app-release.aab "dist/orbitly-$V.aab"
          (cd dist && sha256sum "orbitly-$V.apk" "orbitly-$V-arm64-v8a.apk" "orbitly-$V-armeabi-v7a.apk" "orbitly-$V.aab" "orbitly-$V.spdx.json" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for f in "dist/orbitly-$V.apk" "dist/orbitly-$V-arm64-v8a.apk" "dist/orbitly-$V-armeabi-v7a.apk"; do
            "$BT/apksigner" verify --print-certs "$f" | grep -i 'SHA-256'
          done
          # Warning only (never fails the release): the 64-bit APK against the
          # recorded size baseline.
          scripts/apk-size-budget.sh "dist/orbitly-$V-arm64-v8a.apk" || echo "::warning::arm64 APK exceeds the size budget (scripts/apk-size-baseline.txt)"

      - name: Remove signing material
        if: always()
        run: rm -f app/android/key.properties app/android/release.jks

      - name: Keep build files
        uses: actions/upload-artifact@v4
        with:
          name: orbitly-${{ steps.ver.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRE: ${{ steps.ver.outputs.prerelease }}
          V: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "$PRE" = "true" ]; then FLAGS+=(--prerelease); else FLAGS+=(--latest); fi
          gh release create "$GITHUB_REF_NAME" "${FLAGS[@]}" \
            --title "Orbitly $V" \
            --notes "Android build $V (versionCode ${{ steps.ver.outputs.code }}). Verify the APK against SHA256SUMS.txt. Install/update with Obtainium; see docs/android-install-and-updates.md." \
            dist/*
