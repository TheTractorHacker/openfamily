name: Wear OS release

# Builds the Orbitly Wear OS watch app (wear/, a separate Gradle project) and, on
# a v* tag, attaches orbitly-wear-<ver>.apk / .aab and their SHA256 entries to the
# GitHub release that apk.yml creates. Independent of apk.yml: if this workflow
# fails, the phone release is untouched. Manual runs only keep workflow artifacts.
#
# Signing uses the same secrets as apk.yml (ANDROID_KEYSTORE_BASE64, ...). When
# they are not set the build still runs and produces UNSIGNED files (smoke
# build, not installable) and says so; it never falls back to a debug key.
#
# The release must keep exactly one phone APK (Obtainium and the server's APK
# cache take the first .apk). The watch file is named orbitly-wear-*.apk and the
# server skips that prefix; in Obtainium use the filter regex ^orbitly-[0-9].
#
# versionName/versionCode use the same formula as apk.yml.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wear-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # only to attach files to the existing release on tag pushes
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Derive version
        id: ver
        run: |
          set -euo pipefail
          if [ "$IS_TAG" = "true" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml | head -1)"
          fi
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z]+\.?[0-9]+)?$'; then
            echo "Version '$V' is not semver like 1.2.3 or 1.2.3-rc.1" >&2; exit 1
          fi
          BASE="${V%%-*}"
          IFS=. read -r MA MI PA <<<"$BASE"
          if [ "$MI" -ge 1000 ] || [ "$PA" -ge 1000 ] || [ "$MA" -ge 20 ]; then
            echo "version component out of range" >&2; exit 1
          fi
          SUFFIX=99
          if [ "$V" != "$BASE" ]; then
            N="$(echo "${V#*-}" | grep -Eo '[0-9]+$')"
            SUFFIX=$(( N > 98 ? 98 : N ))
            [ "$SUFFIX" -ge 1 ] || SUFFIX=1
          fi
          CODE=$(( (MA*1000000 + MI*1000 + PA) * 100 + SUFFIX ))
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$V versionCode=$CODE"

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests
        working-directory: wear
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Configure Android signing
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not set: the watch files below are UNSIGNED and cannot be installed or attached to a release."
            exit 0
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > wear/release.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "release.jks"
          } > wear/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK and AAB
        working-directory: wear
        run: |
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease \
            -PWEAR_VERSION_NAME='${{ steps.ver.outputs.name }}' -PWEAR_VERSION_CODE='${{ steps.ver.outputs.code }}'

      - name: Stage and checksum
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.name }}'
          SIGNED='${{ steps.sign.outputs.signed }}'
          mkdir -p dist
          if [ "$SIGNED" = "true" ]; then
            cp wear/app/build/outputs/apk/release/app-release.apk "dist/orbitly-wear-$V.apk"
          else
            cp wear/app/build/outputs/apk/release/app-release-unsigned.apk "dist/orbitly-wear-$V-unsigned.apk"
          fi
          cp wear/app/build/outputs/bundle/release/app-release.aab "dist/orbitly-wear-$V.aab"
          (cd dist && sha256sum orbitly-wear-* > SHA256SUMS-wear.txt && cat SHA256SUMS-wear.txt)
          if [ "$SIGNED" = "true" ]; then
            BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
            "$BT/apksigner" verify --print-certs "dist/orbitly-wear-$V.apk" | grep -i 'SHA-256'
          fi

      - name: Remove signing material
        if: always()
        run: rm -f wear/key.properties wear/release.jks

      - name: Keep build files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orbitly-wear-${{ steps.ver.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: env.IS_TAG == 'true' && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # apk.yml creates the release (it also runs the app tests, so it is usually
          # slower than this job). Never create it here: wait for it.
          for i in $(seq 1 90); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then break; fi
            echo "release $GITHUB_REF_NAME not there yet ($i/90), waiting"; sleep 60
          done
          gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" --clobber dist/*

      - name: Unsigned notice
        if: env.IS_TAG == 'true' && steps.sign.outputs.signed != 'true'
        run: |
          echo "::error::Release tag built without signing secrets, nothing was attached to the release."
          exit 1
