name: Android build cache

# Fills the Gradle, Android NDK/CMake and Gradle build caches for the release
# workflows. GitHub only lets a tag run READ caches written by the default
# branch (a cache saved by a tag run is visible to that tag only), so the cache
# is built here, on main, whenever the native/Gradle inputs change, and once a
# week so it does not expire (unused caches are deleted after 7 days).
#
# The build is a throw-away debug-signed release build: no secrets are used and
# nothing is published or uploaded. Cache poisoning note: only code that was
# merged to main can write these caches; pull request runs cannot.

on:
  push:
    branches: [main]
    paths:
      - 'app/android/**'
      - 'app/pubspec.lock'
      - 'wear/**'
      - '.github/workflows/android-cache.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-cache
  cancel-in-progress: true

jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - name: Gradle and Android SDK caches (restore, then save on a miss)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
          key: android-gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'app/pubspec.lock') }}
          restore-keys: |
            android-gradle-${{ runner.os }}-
      - name: Gradle settings for a 16 GB runner
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC' \
            'org.gradle.parallel=true' 'org.gradle.caching=true' 'kotlin.daemon.jvmargs=-Xmx3G' > ~/.gradle/gradle.properties
      - name: Warm build (arm64 + arm, then the bundle)
        working-directory: app
        env:
          ORG_GRADLE_PROJECT_OPENFAMILY_ALLOW_DEBUG_SIGNING: 'true'
        run: |
          flutter pub get
          flutter build apk --release --no-pub --target-platform android-arm,android-arm64
          flutter build appbundle --release --no-pub
          (cd android && ./gradlew --stop)
          # Never cache anything that is not a dependency or build cache.
          rm -rf ~/.gradle/caches/*/fileHashes ~/.gradle/daemon ~/.gradle/native 2>/dev/null || true

  wear:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle cache (restore, then save on a miss)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: wear-gradle-${{ runner.os }}-${{ hashFiles('wear/**/*.gradle*', 'wear/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            wear-gradle-${{ runner.os }}-
      - name: Warm build (unsigned)
        working-directory: wear
        run: |
          ./gradlew --parallel :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease
          ./gradlew --stop
