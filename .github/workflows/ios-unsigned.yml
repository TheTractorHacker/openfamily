name: iOS unsigned IPA (sideload)

# Builds an UNSIGNED .ipa for sideloading (AltStore, Sideloadly, ...) and attaches
# it to the repository's own GitHub release for the tag. Needs NO secrets and
# never touches the signed TestFlight path (ios-release.yml). The file is named
# "-unsigned" on purpose: it cannot be installed as is, a sideloading tool must
# re-sign it with the user's own Apple ID. Caveats: docs/design/IOS_RELEASE.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read # the build job never writes; only the attach job below can

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Version
        id: ver
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.0-dev"
          fi
          BASE="${V%%-*}"
          IFS=. read -r MA MI PA <<<"$BASE"
          CODE=$(( (MA*1000000 + MI*1000 + PA)*100 + 99 ))
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $V (CFBundleShortVersionString $BASE, CFBundleVersion $CODE)"

      - name: Dependencies
        run: flutter pub get

      - name: Build (release, no code signing)
        run: |
          flutter build ios --release --no-codesign \
            --build-name='${{ steps.ver.outputs.base }}' --build-number='${{ steps.ver.outputs.code }}'

      - name: Package unsigned .ipa
        id: pkg
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.name }}'
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP"
          # Prove it really is unsigned: no embedded provisioning profile.
          if [ -e "$APP/embedded.mobileprovision" ]; then echo "unexpected provisioning profile"; exit 1; fi
          # The Apple Watch app (app/ios/OrbitlyWatch) rides inside the iPhone app
          # bundle as Runner.app/Watch/OrbitlyWatch.app; `cp -R` below carries it.
          # When the project has the watch target it MUST be there, otherwise the
          # IPA would silently ship without it.
          if grep -q AB1C0DE0 ios/Runner.xcodeproj/project.pbxproj; then
            test -f "$APP/Watch/OrbitlyWatch.app/Info.plist" || { echo "watch app missing from $APP/Watch"; exit 1; }
            if [ -e "$APP/Watch/OrbitlyWatch.app/embedded.mobileprovision" ]; then echo "unexpected provisioning profile in the watch app"; exit 1; fi
          fi
          rm -rf ../dist _ipa && mkdir -p ../dist _ipa/Payload
          cp -R "$APP" _ipa/Payload/Runner.app
          OUT="$PWD/../dist/orbitly-$V-unsigned.ipa"
          (cd _ipa && zip -qry "$OUT" Payload)
          unzip -l "$OUT" | grep -q 'Payload/Runner.app/Info.plist'
          if grep -q AB1C0DE0 ios/Runner.xcodeproj/project.pbxproj; then
            unzip -l "$OUT" | grep -q 'Payload/Runner.app/Watch/OrbitlyWatch.app/Info.plist'
          fi
          (cd ../dist && shasum -a 256 "orbitly-$V-unsigned.ipa" | tee "orbitly-$V-unsigned.ipa.sha256")
          codesign -dv "$APP" 2>&1 | head -5 || true

      - name: Keep build files
        uses: actions/upload-artifact@v4
        with:
          name: orbitly-${{ steps.ver.outputs.name }}-unsigned-ipa
          path: dist/*
          if-no-files-found: error

  # Separate job so the write token is never present while third-party actions run.
  # Only first-party actions and the gh CLI are used here, and only on a tag build
  # of THIS repository, only with the workflow's own GITHUB_TOKEN, only to this
  # repository's release for that tag.
  attach:
    needs: ipa
    if: github.ref_type == 'tag' && startsWith(github.repository, 'TheTractorHacker/')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - name: Version
        id: ver
        run: |
          set -euo pipefail
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: orbitly-${{ steps.ver.outputs.name }}-unsigned-ipa
          path: dist
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          V: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          # apk.yml creates the release for the tag; wait for it (up to 60 min)
          # instead of creating one here, which would race with it.
          for i in $(seq 1 60); do
            gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 && break
            echo "release $TAG not there yet ($i/60)"; sleep 60
          done
          gh release view "$TAG" --repo "$REPO" >/dev/null
          SHA=$(cut -d' ' -f1 "dist/orbitly-$V-unsigned.ipa.sha256")
          gh release upload "$TAG" --repo "$REPO" --clobber \
            "dist/orbitly-$V-unsigned.ipa" "dist/orbitly-$V-unsigned.ipa.sha256"
          NOTES=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)
          case "$NOTES" in *"orbitly-$V-unsigned.ipa"*) exit 0;; esac
          gh release edit "$TAG" --repo "$REPO" --notes "$NOTES

          iOS UNSIGNED build (sideload only, re-sign with AltStore/Sideloadly; see docs/design/IOS_RELEASE.md): \`orbitly-$V-unsigned.ipa\`
          SHA256: \`$SHA\`"
