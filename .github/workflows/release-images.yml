name: Release images

# Builds the backend container image for linux/amd64 and linux/arm64, then
# (tags only) pushes it to GHCR, attaches an SBOM and SLSA provenance, and
# signs it with cosign keyless (GitHub OIDC; no signing key to store).
# Companion of apk.yml, which builds the signed APK/AAB, checksums and release.
#
# Manual runs (workflow_dispatch) are a DRY RUN: the image is built for both
# platforms but not pushed or signed, and the SBOM is uploaded as an artifact.
#
# Verify a published image:
#   cosign verify ghcr.io/<owner>/openfamily-api:<tag> \
#     --certificate-identity-regexp 'https://github.com/<owner>/<repo>/.github/workflows/release-images.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write   # push to GHCR (tags only)
      id-token: write   # cosign keyless signing (tags only)
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Image name and version
        id: meta
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/openfamily-api" >> "$GITHUB_OUTPUT"
          if [ "$IS_TAG" = "true" ]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "version=dryrun-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: env.IS_TAG == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build (and push on tags)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: GIT_COMMIT=${{ github.sha }}
          push: ${{ env.IS_TAG == 'true' }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          sbom: true
          provenance: mode=max

      - name: Install cosign
        if: env.IS_TAG == 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the image by digest (keyless)
        if: env.IS_TAG == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: SBOM (SPDX) for the source tree and image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: openfamily-${{ steps.meta.outputs.version }}.spdx.json
          artifact-name: sbom-${{ steps.meta.outputs.version }}.spdx.json

      - name: Record digest
        run: |
          {
            echo "image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo "pushed: ${IS_TAG}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
