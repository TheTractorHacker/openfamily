name: iOS release (TestFlight) - SKELETON, DISABLED

# Decision record: docs/design/IOS_RELEASE.md. Not run on GitHub; not yet
# validated against a real Apple account. The job is disabled unless the repository variable IOS_RELEASE_ENABLED is 'true'
# until the secrets below exist; set the variable after adding them.
#
# Secrets (GitHub secrets only, never committed):
#   IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64,
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build name, e.g. 0.14.0'
        required: true
      build_number:
        description: 'Build number (monotonic integer)'
        required: true

permissions:
  contents: read

jobs:
  testflight:
    if: ${{ vars.IOS_RELEASE_ENABLED == 'true' }} # BLOCKED: needs an Apple Developer account + secrets
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Import signing certificate and profile
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/build.keychain"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc"
          security list-keychains -d user -s "$kc" login.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/openfamily.mobileprovision"

      - name: Build signed IPA
        working-directory: app
        run: |
          flutter pub get
          flutter build ipa --release \
            --build-name='${{ inputs.version }}' --build-number='${{ inputs.build_number }}' \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios -f app/build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/.appstoreconnect" "$RUNNER_TEMP/cert.p12"
