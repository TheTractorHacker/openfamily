name: Backup restore test

# Restores a freshly taken backup (plain and encrypted) into a scratch
# TimescaleDB container and compares row counts; also the S3 round trip
# (backup -> MinIO -> download -> decrypt -> restore) with the backup service. See docs/backup-restore.md.

on:
  pull_request:
    paths:
      - 'scripts/backup.sh'
      - 'scripts/restore.sh'
      - 'scripts/verify-backup.sh'
      - 'scripts/backup-restore.test.sh'
      - 'scripts/lib-s3.sh'
      - 'backend/internal/backup/**'
      - 'backend/cmd/backup/**'
      - 'backend/Dockerfile'
      - 'backend/internal/db/migrations/**'
      - 'docker-compose.yml'
      - '.github/workflows/backup-restore.yml'
  schedule:
    - cron: '41 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/backup-restore.test.sh
