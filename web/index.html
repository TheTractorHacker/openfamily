<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Mirrors --paper. A meta tag cannot read a custom property. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEF2F6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1C1E22" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="any" href="%BASE_URL%favicon.ico" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/orbitly-touch-icon.png" />
    <meta property="og:image" content="https://life.foleyit.com/admin/brand/orbitly-social-card.png" />
    <title>Orbitly Admin</title>
    <script>
      (function () {
        var pref = 'system'
        try { pref = localStorage.getItem('wb-theme') || 'system' } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
