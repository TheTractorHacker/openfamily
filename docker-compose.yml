# Orbitly. Basic install:   ./scripts/setup.sh && docker compose up -d
#
# Always started: api, postgres and backup (nightly database backups to
# ./backups, kept 7 daily / 4 weekly / 6 monthly; manage them in the admin
# panel under Settings > Backups; add encryption and S3 there or in .env).
# Opt out of the backup service with BACKUP_REPLICAS=0 in .env.
#
# Optional components are compose profiles (enable with --profile or the
# COMPOSE_PROFILES variable in .env):
#   proxy  Caddy reverse proxy with automatic HTTPS (set SITE_ADDRESS)
#   push   self-hosted ntfy server for UnifiedPush (Android push)
#   e2ee-server  OPT-IN "trusted server member" for Private circles: the Orbitly
#          server gets its own approved device so it can read circles whose members
#          ALL consent (admin map, history, Dawarich sync, place alerts work again).
#          The server then holds plaintext for those circles. Read
#          docs/design/E2EE.md ("Trusted-server mode") before enabling.
# e.g.  COMPOSE_PROFILES=proxy,push   or   docker compose --profile proxy up -d
#
# Without the proxy profile the API is published on 127.0.0.1:${API_PORT:-8080}
# only; put your own TLS reverse proxy in front of it or enable "proxy".
name: openfamily

x-hardening: &hardening
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: openfamily-api:local
    # Non-root user baked into the image (see backend/Dockerfile).
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HTTP_ADDR: ":8080"
      # Local dev uses sslmode=disable (Postgres is only reachable on the
      # private compose network). With APP_ENV=production the API refuses
      # sslmode=disable unless DB_SSL_DISABLE_OK=true, or you point
      # DATABASE_URL at a Postgres with TLS and sslmode=require/verify-full.
      # See docs/self-hosting.md ("Database TLS").
      DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER:-openfamily}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run ./scripts/setup.sh to generate .env}@postgres:5432/${POSTGRES_DB:-openfamily}?sslmode=${DB_SSLMODE:-disable}}"
      DB_SSL_DISABLE_OK: ${DB_SSL_DISABLE_OK:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - run ./scripts/setup.sh to generate .env}
      ACCESS_TOKEN_TTL: "15m"
      REFRESH_TOKEN_TTL: "720h"
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      # Read-only passthrough so the admin panel can show domain status.
      SITE_ADDRESS: ${SITE_ADDRESS:-}
      APP_ENV: ${APP_ENV:-development}
      # TLS is terminated in front of the API (Caddy or your own proxy).
      TLS_BEHIND_PROXY: ${TLS_BEHIND_PROXY:-true}
      # Comma-separated CIDRs of reverse proxies whose X-Forwarded-For is trusted.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # SOS / alert limits and share-link lifetime (see docs/safety.md).
      ALERT_SOS_COOLDOWN: ${ALERT_SOS_COOLDOWN:-}
      ALERT_COOLDOWN: ${ALERT_COOLDOWN:-}
      ALERT_FAMILY_MAX_PER_HOUR: ${ALERT_FAMILY_MAX_PER_HOUR:-}
      ALERT_SMS_MAX_RECIPIENTS: ${ALERT_SMS_MAX_RECIPIENTS:-}
      ALERT_SMS_SENDER_PER_DAY: ${ALERT_SMS_SENDER_PER_DAY:-}
      ALERT_SMS_FAMILY_PER_HOUR: ${ALERT_SMS_FAMILY_PER_HOUR:-}
      ALERT_SMS_ON_CHECKIN: ${ALERT_SMS_ON_CHECKIN:-}
      ALERT_SHARE_TTL: ${ALERT_SHARE_TTL:-}
      INGEST_KEY_TTL: ${INGEST_KEY_TTL:-2160h}
      # Driving event thresholds (empty = defaults; see docs/driving.md).
      DRIVING_SPEEDING_MPS: ${DRIVING_SPEEDING_MPS:-}
      DRIVING_SPEEDING_SECONDS: ${DRIVING_SPEEDING_SECONDS:-}
      DRIVING_HARD_BRAKE_MPS2: ${DRIVING_HARD_BRAKE_MPS2:-}
      DRIVING_RAPID_ACCEL_MPS2: ${DRIVING_RAPID_ACCEL_MPS2:-}
      INSECURE_HTTP: ${INSECURE_HTTP:-false}
      # Admin System page warns when the newest successful backup is older than this.
      BACKUP_STALE_HOURS: ${BACKUP_STALE_HOURS:-}
      # Key secret for S3 credentials saved from the admin UI (default: derived from JWT_SECRET).
      BACKUP_SETTINGS_KEY: ${BACKUP_SETTINGS_KEY:-}
      # Trusted-server mode (profile e2ee-server). Empty = the mode does not exist
      # for this server and Private circles keep the strict phase-2 behaviour.
      # Generate once: openssl rand -hex 32  (>= 32 characters; shared with the
      # e2ee-server-device container only).
      E2EE_SERVER_INGEST_TOKEN: ${E2EE_SERVER_INGEST_TOKEN:-}
      # Where does this server run? home = hardware you own (NAS, mini PC at home);
      # cloud = a VPS or hosted server. EMPTY is treated as cloud (the careful side)
      # until the admin chooses in Settings. See docs/server-setup.md.
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-}
      # Cloud servers: seals a few stored secrets (SMS token, webhook secrets) so a stolen
      # disk or database dump is useless without it. >= 32 chars, openssl rand -base64 32.
      # KEEP A COPY OUTSIDE THE SERVER; once used, the server will not start without it.
      OPENFAMILY_DATA_KEY: ${OPENFAMILY_DATA_KEY:-}
      # auto (default): the API is its own server device unless E2EE_SERVER_INGEST_TOKEN is set for the
      # optional sidecar. builtin | sidecar | off to force.
      OPENFAMILY_SERVER_DEVICE: ${OPENFAMILY_SERVER_DEVICE:-auto}
      # Web access from any browser (docs/admin/web-access-anywhere.md): on by default, inert until an
      # admin sets it up. off = hard off switch. Its pepper file lives in the server_device volume.
      E2EE_VIEWER_VAULT: ${E2EE_VIEWER_VAULT:-on}
      E2EE_VIEWER_VAULT_PEPPER_FILE: ${E2EE_VIEWER_VAULT_PEPPER_FILE:-}
      VERBOSE_PUSH: ${VERBOSE_PUSH:-false}
      DIRECT_PUSH: ${DIRECT_PUSH:-true}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      # Advertised to the app via GET /config so a generic APK can register
      # UnifiedPush without a dart-define.
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:2586}
      TILE_URL: ${TILE_URL:-}
      SATELLITE_TILE_URL: ${SATELLITE_TILE_URL:-}
      MAP_STYLE_URL: ${MAP_STYLE_URL:-}
      # Refuse admin panel/API access to platform admins without TOTP.
      REQUIRE_ADMIN_MFA: ${REQUIRE_ADMIN_MFA:-false}
      # Address search / automatic address detection for places. The server
      # proxies it, so phones never contact the provider. `-` (not `:-`) means
      # an explicitly EMPTY GEOCODER_URL disables the feature. See docs/maps.md.
      GEOCODER_URL: ${GEOCODER_URL-https://photon.komoot.io}
      GEOCODER_TYPE: ${GEOCODER_TYPE:-photon}
      GEOCODER_LANG: ${GEOCODER_LANG:-}
      GEOCODER_ALLOW_PRIVATE: ${GEOCODER_ALLOW_PRIVATE:-false}
      GEOCODER_FALLBACK_URL: ${GEOCODER_FALLBACK_URL-https://nominatim.openstreetmap.org}
      GEOCODER_CENSUS_ENABLED: ${GEOCODER_CENSUS_ENABLED:-true}
      # Optional paid Google Geocoding (server-side only). Empty = free providers only.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_GEOCODING_MONTHLY_CAP: ${GOOGLE_GEOCODING_MONTHLY_CAP:-}
      # APNs (iOS push). Empty disables APNs; Android still works via ntfy.
      # To enable iOS push, add a volume mount to this service:
      #   volumes:
      #     - ./apns/AuthKey.p8:/apns/AuthKey.p8:ro
      # and set APNS_KEY_FILE=/apns/AuthKey.p8 in .env.
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-false}
      IOS_TEAM_ID: ${IOS_TEAM_ID:-}
      IOS_BUNDLE_ID: ${IOS_BUNDLE_ID:-}
      # Optional Twilio SMS for family alerts. Empty disables SMS.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      # Other SMS providers (twilio default | telnyx | plivo | sns); see docs/sms.md.
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_REGION: ${SMS_REGION:-}
      SMS_ACCOUNT_ID: ${SMS_ACCOUNT_ID:-}
      SMS_AUTH_TOKEN: ${SMS_AUTH_TOKEN:-}
      SMS_FROM: ${SMS_FROM:-}
      # Privacy policy knobs (see docs/privacy-controls.md). Platform admins see
      # no member locations unless this is true; every read is audit-logged.
      ADMIN_LOCATION_ACCESS: ${ADMIN_LOCATION_ACCESS:-false}
      LOCATION_RETENTION_DAYS: ${LOCATION_RETENTION_DAYS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Directory the admin panel caches the v* GitHub Release APK into.
      APK_DIR: ${APK_DIR:-/data/apk}
      APK_GITHUB_REPO: ${APK_GITHUB_REPO:-TheTractorHacker/openfamily}
      APK_GITHUB_TOKEN: ${APK_GITHUB_TOKEN:-}
    volumes:
      - apk_data:/data/apk
      # The server's own device key (built-in server participant, docs/design/PRIVACY_PROCESSING.md
      # section 22). Created on first start, files 0600. Back this volume up with the database.
      - server_device:/data/server-device
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1$${HTTP_ADDR}/healthz\" >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  postgres:
    <<: *hardening
    # Pinned for reproducible installs. Bump deliberately (and take a backup
    # first: ./scripts/backup.sh) rather than tracking a moving tag.
    image: timescale/timescaledb-ha:pg16.15-ts2.31.0@sha256:98f88217cb7be56655f842d9920f90d0b4893b67b3463f93084548b433ed5c93
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openfamily}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run ./scripts/setup.sh to generate .env}
      POSTGRES_DB: ${POSTGRES_DB:-openfamily}
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  caddy:
    <<: *hardening
    profiles: ["proxy"]
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    # Caddy needs to bind 80/443 inside its container; everything else is dropped.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Production: your domain, e.g. "openfamily.example.com" (Caddy
      # provisions Let's Encrypt automatically). ":80" is HTTP only.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Only used with CADDYFILE=Caddyfile.with-push (profiles proxy + push).
      PUSH_ADDRESS: ${PUSH_ADDRESS:-}
    volumes:
      - ./caddy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  ntfy:
    <<: *hardening
    profiles: ["push"]
    image: binwiederhier/ntfy:v2.11.0@sha256:4a7d0f0adc6d5d9fc36e64ab55ef676e76e124a2bdd50ce115b6d9c1c7430294
    command: serve
    environment:
      # Public base URL the app uses to reach ntfy. Production must be https://
      # on PUSH_ADDRESS (see caddy/Caddyfile.with-push).
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://127.0.0.1:2586}
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_etc:/etc/ntfy
    expose:
      - "80"
    ports:
      - "127.0.0.1:2586:80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # OPT-IN: the Orbitly server as an approved member device of Private circles.
  # One-time enrollment (prints the name and fingerprint to approve on the phone):
  #   docker compose --profile e2ee-server run --rm -T e2ee-server-device enroll --kind server \
  #       --server http://api:8080 --email you@example.org < password.txt
  #   (approve the REQUEST CODE on the phone: Encryption keys > Approve a viewer or bridge)
  #   docker compose --profile e2ee-server run --rm e2ee-server-device enroll --approval <APPROVAL CODE>
  # Then every member opens the circle > Encryption > Trusted server and allows it.
  # The private key lives in the e2ee_server_state volume (0600), never in Postgres.
  # LANES circles (per-member processing lanes, docs/design/PRIVACY_PROCESSING.md): this container
  # then holds ONLY the server key SK, never a circle key CK, and ingests only members who signed
  # the server lane. An admin's phone wraps SK to it; it reports missing wraps in its log. Exit 3
  # (key revoked / admin switched server assistance off) and exit 7 (the server handed it a CK wrap)
  # are deliberate stops: with the hardening anchor's "restart: unless-stopped" docker restarts it
  # anyway and it stops again at once; set `restart: "no"` here if that noise bothers you.
  e2ee-server-device:
    <<: *hardening
    profiles: ["e2ee-server"]
    build:
      context: .
      dockerfile: deploy/e2ee-bridge/Dockerfile
    image: openfamily-e2ee-server-device:local
    depends_on:
      - api
    read_only: true
    environment:
      E2EE_BRIDGE_STATE: /state
      E2EE_SERVER_INGEST_TOKEN: ${E2EE_SERVER_INGEST_TOKEN:-}
      # Optional: seal the key file with a passphrase (kept out of the database).
      E2EE_BRIDGE_PASSPHRASE: ${E2EE_SERVER_DEVICE_PASSPHRASE:-}
    volumes:
      - e2ee_server_state:/state
      - ${E2EE_SERVER_DEVICE_CONFIG:-./deploy/e2ee-bridge/server-config.example.json}:/config/config.json:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Scheduled backups, ON BY DEFAULT: a nightly pg_dump (03:15 UTC) to ./backups
  # with retention (7 daily, 4 weekly, 6 monthly), plus a first backup right
  # after the service starts for the first time. Add age encryption (a public
  # key generated in the admin panel, Settings > Backups) and/or an
  # S3-compatible bucket there or with the BACKUP_* variables below; the
  # PRIVATE key never belongs on the server. The API never sees the S3
  # credentials; the admin "Back up now" button only queues a request this
  # service picks up. See docs/backup-restore.md.
  # Opt out: BACKUP_REPLICAS=0 in .env, then docker compose up -d.
  # The container runs as BACKUP_UID:BACKUP_GID (default 1000:1000) and must be
  # able to write BACKUP_LOCAL_PATH (default ./backups; scripts/setup.sh creates it).
  backup:
    <<: *hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backup
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: openfamily-backup:local
    # Must be able to write ./backups when BACKUP_LOCAL_DIR is used.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
      # Encrypted dump staging area (RAM-backed; raise for very large databases).
      - /work:size=${BACKUP_WORK_SIZE:-4g},mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER:-openfamily}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run ./scripts/setup.sh to generate .env}@postgres:5432/${POSTGRES_DB:-openfamily}?sslmode=${DB_SSLMODE:-disable}}"
      BACKUP_WORK_DIR: /work
      TZ: ${BACKUP_TZ:-UTC}
      BACKUP_TZ: ${BACKUP_TZ:-}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-}
      # Settings left EMPTY here can be set in the admin UI (Backups card); a value set
      # here pins the setting (read-only in the UI). Built-in defaults apply otherwise.
      BACKUP_SETTINGS_KEY: ${BACKUP_SETTINGS_KEY:-${JWT_SECRET}}
      BACKUP_POLL_SECONDS: ${BACKUP_POLL_SECONDS:-}
      # first = take one backup at start-up while none has ever succeeded.
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-first}
      # Local backups go here unless the admin UI or BACKUP_LOCAL_DIR say otherwise.
      BACKUP_DEFAULT_LOCAL_DIR: /backups
      BACKUP_LOCAL_DIR: ${BACKUP_LOCAL_DIR:-}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-}
      BACKUP_RETENTION_DRY_RUN: ${BACKUP_RETENTION_DRY_RUN:-false}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_AGE_PASSPHRASE_FILE: ${BACKUP_AGE_PASSPHRASE_FILE:-}
      BACKUP_ALLOW_UNENCRYPTED: ${BACKUP_ALLOW_UNENCRYPTED:-false}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_PATH_STYLE: ${BACKUP_S3_PATH_STYLE:-}
      BACKUP_S3_STORAGE_CLASS: ${BACKUP_S3_STORAGE_CLASS:-}
      BACKUP_S3_INSECURE: ${BACKUP_S3_INSECURE:-}
      BACKUP_S3_ALLOW_PRIVATE: ${BACKUP_S3_ALLOW_PRIVATE:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_ACCESS_KEY_ID_FILE: ${BACKUP_S3_ACCESS_KEY_ID_FILE:-}
      BACKUP_S3_SECRET_ACCESS_KEY_FILE: ${BACKUP_S3_SECRET_ACCESS_KEY_FILE:-}
    volumes:
      - ${BACKUP_LOCAL_PATH:-./backups}:/backups
      # Optional secret files (passphrase, S3 key files): put them in
      # deploy/backup/ and reference /run/backup-secrets/<name>.
      - ${BACKUP_SECRETS_DIR:-./deploy/backup}:/run/backup-secrets:ro
    deploy:
      # 0 turns the backup service off (BACKUP_REPLICAS=0 in .env).
      replicas: ${BACKUP_REPLICAS:-1}
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  server_device:
  e2ee_server_state:
  caddy_data:
  caddy_config:
  pgdata:
  ntfy_cache:
  ntfy_etc:
  apk_data:
