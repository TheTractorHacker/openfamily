# OpenFamily. Basic install:   ./scripts/setup.sh && docker compose up -d
#
# Optional components are compose profiles (enable with --profile or the
# COMPOSE_PROFILES variable in .env):
#   proxy  Caddy reverse proxy with automatic HTTPS (set SITE_ADDRESS)
#   push   self-hosted ntfy server for UnifiedPush (Android push)
# e.g.  COMPOSE_PROFILES=proxy,push   or   docker compose --profile proxy up -d
#
# Without the proxy profile the API is published on 127.0.0.1:${API_PORT:-8080}
# only; put your own TLS reverse proxy in front of it or enable "proxy".
name: openfamily

x-hardening: &hardening
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: openfamily-api:local
    # Non-root user baked into the image (see backend/Dockerfile).
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HTTP_ADDR: ":8080"
      # Local dev uses sslmode=disable (Postgres is only reachable on the
      # private compose network). With APP_ENV=production the API refuses
      # sslmode=disable unless DB_SSL_DISABLE_OK=true, or you point
      # DATABASE_URL at a Postgres with TLS and sslmode=require/verify-full.
      # See docs/self-hosting.md ("Database TLS").
      DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER:-openfamily}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run ./scripts/setup.sh to generate .env}@postgres:5432/${POSTGRES_DB:-openfamily}?sslmode=${DB_SSLMODE:-disable}}"
      DB_SSL_DISABLE_OK: ${DB_SSL_DISABLE_OK:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - run ./scripts/setup.sh to generate .env}
      ACCESS_TOKEN_TTL: "15m"
      REFRESH_TOKEN_TTL: "720h"
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      # Read-only passthrough so the admin panel can show domain status.
      SITE_ADDRESS: ${SITE_ADDRESS:-}
      APP_ENV: ${APP_ENV:-development}
      # TLS is terminated in front of the API (Caddy or your own proxy).
      TLS_BEHIND_PROXY: ${TLS_BEHIND_PROXY:-true}
      # Comma-separated CIDRs of reverse proxies whose X-Forwarded-For is trusted.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # SOS / alert limits and share-link lifetime (see docs/safety.md).
      ALERT_SOS_COOLDOWN: ${ALERT_SOS_COOLDOWN:-}
      ALERT_COOLDOWN: ${ALERT_COOLDOWN:-}
      ALERT_FAMILY_MAX_PER_HOUR: ${ALERT_FAMILY_MAX_PER_HOUR:-}
      ALERT_SMS_MAX_RECIPIENTS: ${ALERT_SMS_MAX_RECIPIENTS:-}
      ALERT_SMS_SENDER_PER_DAY: ${ALERT_SMS_SENDER_PER_DAY:-}
      ALERT_SMS_FAMILY_PER_HOUR: ${ALERT_SMS_FAMILY_PER_HOUR:-}
      ALERT_SMS_ON_CHECKIN: ${ALERT_SMS_ON_CHECKIN:-}
      ALERT_SHARE_TTL: ${ALERT_SHARE_TTL:-}
      INGEST_KEY_TTL: ${INGEST_KEY_TTL:-2160h}
      # Driving event thresholds (empty = defaults; see docs/driving.md).
      DRIVING_SPEEDING_MPS: ${DRIVING_SPEEDING_MPS:-}
      DRIVING_SPEEDING_SECONDS: ${DRIVING_SPEEDING_SECONDS:-}
      DRIVING_HARD_BRAKE_MPS2: ${DRIVING_HARD_BRAKE_MPS2:-}
      DRIVING_RAPID_ACCEL_MPS2: ${DRIVING_RAPID_ACCEL_MPS2:-}
      INSECURE_HTTP: ${INSECURE_HTTP:-false}
      VERBOSE_PUSH: ${VERBOSE_PUSH:-false}
      DIRECT_PUSH: ${DIRECT_PUSH:-true}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      # Advertised to the app via GET /config so a generic APK can register
      # UnifiedPush without a dart-define.
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:2586}
      TILE_URL: ${TILE_URL:-}
      SATELLITE_TILE_URL: ${SATELLITE_TILE_URL:-}
      MAP_STYLE_URL: ${MAP_STYLE_URL:-}
      # Address search / automatic address detection for places. The server
      # proxies it, so phones never contact the provider. `-` (not `:-`) means
      # an explicitly EMPTY GEOCODER_URL disables the feature. See docs/maps.md.
      GEOCODER_URL: ${GEOCODER_URL-https://photon.komoot.io}
      GEOCODER_TYPE: ${GEOCODER_TYPE:-photon}
      GEOCODER_LANG: ${GEOCODER_LANG:-}
      GEOCODER_ALLOW_PRIVATE: ${GEOCODER_ALLOW_PRIVATE:-false}
      GEOCODER_FALLBACK_URL: ${GEOCODER_FALLBACK_URL-https://nominatim.openstreetmap.org}
      GEOCODER_CENSUS_ENABLED: ${GEOCODER_CENSUS_ENABLED:-true}
      # APNs (iOS push). Empty disables APNs; Android still works via ntfy.
      # To enable iOS push, add a volume mount to this service:
      #   volumes:
      #     - ./apns/AuthKey.p8:/apns/AuthKey.p8:ro
      # and set APNS_KEY_FILE=/apns/AuthKey.p8 in .env.
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-false}
      # Optional Twilio SMS for family alerts. Empty disables SMS.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Directory the admin panel caches the v* GitHub Release APK into.
      APK_DIR: ${APK_DIR:-/data/apk}
      APK_GITHUB_REPO: ${APK_GITHUB_REPO:-TheTractorHacker/openfamily}
      APK_GITHUB_TOKEN: ${APK_GITHUB_TOKEN:-}
    volumes:
      - apk_data:/data/apk
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1$${HTTP_ADDR}/healthz\" >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  postgres:
    <<: *hardening
    # Pinned for reproducible installs. Bump deliberately (and take a backup
    # first: ./scripts/backup.sh) rather than tracking a moving tag.
    image: timescale/timescaledb-ha:pg16.15-ts2.31.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openfamily}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run ./scripts/setup.sh to generate .env}
      POSTGRES_DB: ${POSTGRES_DB:-openfamily}
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  caddy:
    <<: *hardening
    profiles: ["proxy"]
    image: caddy:2.10.2-alpine
    # Caddy needs to bind 80/443 inside its container; everything else is dropped.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Production: your domain, e.g. "openfamily.example.com" (Caddy
      # provisions Let's Encrypt automatically). ":80" is HTTP only.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Only used with CADDYFILE=Caddyfile.with-push (profiles proxy + push).
      PUSH_ADDRESS: ${PUSH_ADDRESS:-}
    volumes:
      - ./caddy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  ntfy:
    <<: *hardening
    profiles: ["push"]
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    environment:
      # Public base URL the app uses to reach ntfy. Production must be https://
      # on PUSH_ADDRESS (see caddy/Caddyfile.with-push).
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://127.0.0.1:2586}
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_etc:/etc/ntfy
    expose:
      - "80"
    ports:
      - "127.0.0.1:2586:80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  ntfy_cache:
  ntfy_etc:
  apk_data:
