<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Who can read your location in Normal, Private and server-processed circles</title>
  <desc id="d">Three rows. Normal: your phone sends a readable position to the server, which draws the map and sends it to the other phones. Private: your phone locks the position, the server only passes on locked data, and the other phones unlock it. Private with server processing: like Private, but you also give the server a readable copy for your own data.</desc>
  <rect width="760" height="400" rx="16" fill="#f8fafc" stroke="#c9d4df"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#54707c"/></marker>
  </defs>
  <g font-size="13" fill="#111827">
    <!-- Row 1: Normal -->
    <text x="24" y="34" font-size="15" font-weight="700">Normal circle</text>
    <text x="24" y="52" fill="#54707c">The server can read positions and does the work.</text>
    <rect x="24" y="66" width="150" height="62" rx="10" fill="#e8eef4" stroke="#b4c2cf"/>
    <text x="99" y="92" text-anchor="middle" font-weight="600">Your phone</text>
    <text x="99" y="110" text-anchor="middle" fill="#54707c">sends position</text>
    <rect x="305" y="66" width="150" height="62" rx="10" fill="#e6f8ee" stroke="#c7ecd6"/>
    <text x="380" y="88" text-anchor="middle" font-weight="600">Your server</text>
    <text x="380" y="106" text-anchor="middle" fill="#15824a">reads it: map, trips,</text>
    <text x="380" y="121" text-anchor="middle" fill="#15824a">alerts, reports</text>
    <rect x="586" y="66" width="150" height="62" rx="10" fill="#e8eef4" stroke="#b4c2cf"/>
    <text x="661" y="92" text-anchor="middle" font-weight="600">Circle phones</text>
    <text x="661" y="110" text-anchor="middle" fill="#54707c">show the map</text>
    <path d="M176 97H303" stroke="#54707c" stroke-width="2" marker-end="url(#a)"/>
    <path d="M457 97H584" stroke="#54707c" stroke-width="2" marker-end="url(#a)"/>
    <text x="240" y="90" text-anchor="middle" font-size="11" fill="#15824a">readable</text>
    <text x="520" y="90" text-anchor="middle" font-size="11" fill="#15824a">readable</text>

    <!-- Row 2: Private -->
    <text x="24" y="168" font-size="15" font-weight="700">Private circle, "Keep on my phone"</text>
    <text x="24" y="186" fill="#54707c">The server only passes on locked data. Phones do the work.</text>
    <rect x="24" y="200" width="150" height="62" rx="10" fill="#e8eef4" stroke="#b4c2cf"/>
    <text x="99" y="226" text-anchor="middle" font-weight="600">Your phone</text>
    <text x="99" y="244" text-anchor="middle" fill="#54707c">locks, then sends</text>
    <rect x="305" y="200" width="150" height="62" rx="10" fill="#ede3fb" stroke="#ddc9f7"/>
    <text x="380" y="222" text-anchor="middle" font-weight="600">Your server</text>
    <text x="380" y="240" text-anchor="middle" fill="#5b1da8">cannot read it,</text>
    <text x="380" y="255" text-anchor="middle" fill="#5b1da8">only relays it</text>
    <rect x="586" y="200" width="150" height="62" rx="10" fill="#e8eef4" stroke="#b4c2cf"/>
    <text x="661" y="226" text-anchor="middle" font-weight="600">Circle phones</text>
    <text x="661" y="244" text-anchor="middle" fill="#54707c">unlock and show</text>
    <path d="M176 231H303" stroke="#54707c" stroke-width="2" marker-end="url(#a)"/>
    <path d="M457 231H584" stroke="#54707c" stroke-width="2" marker-end="url(#a)"/>
    <text x="240" y="224" text-anchor="middle" font-size="11" fill="#5b1da8">locked</text>
    <text x="520" y="224" text-anchor="middle" font-size="11" fill="#5b1da8">locked</text>

    <!-- Row 3: Private with server -->
    <text x="24" y="302" font-size="15" font-weight="700">Private circle, "Use the server" (your choice, only for you)</text>
    <text x="24" y="320" fill="#54707c">Like Private, plus a readable copy of your own data for the server.</text>
    <rect x="24" y="334" width="150" height="50" rx="10" fill="#e8eef4" stroke="#b4c2cf"/>
    <text x="99" y="356" text-anchor="middle" font-weight="600">Your phone</text>
    <text x="99" y="373" text-anchor="middle" fill="#54707c">sends both</text>
    <rect x="305" y="334" width="150" height="50" rx="10" fill="#e6f8ee" stroke="#c7ecd6"/>
    <text x="380" y="356" text-anchor="middle" font-weight="600">Your server</text>
    <text x="380" y="373" text-anchor="middle" fill="#15824a">reads your copy only</text>
    <rect x="586" y="334" width="150" height="50" rx="10" fill="#e8eef4" stroke="#b4c2cf"/>
    <text x="661" y="356" text-anchor="middle" font-weight="600">Circle phones</text>
    <text x="661" y="373" text-anchor="middle" fill="#54707c">unlock the locked copy</text>
    <path d="M176 359H303" stroke="#54707c" stroke-width="2" marker-end="url(#a)"/>
    <path d="M457 359H584" stroke="#54707c" stroke-width="2" marker-end="url(#a)"/>
    <text x="240" y="352" text-anchor="middle" font-size="11" fill="#15824a">readable + locked</text>
    <text x="520" y="352" text-anchor="middle" font-size="11" fill="#5b1da8">locked</text>
  </g>
</svg>
